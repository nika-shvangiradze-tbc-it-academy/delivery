<div class="courier-shell">
  <header class="courier-shell__top">
    <div class="courier-shell__brand-block">
      <button
        type="button"
        class="courier-shell__logo"
        (click)="onLogoClick()"
        aria-label="მიმდინარე შეკვეთების განახლება"
      >
        <img
          src="/assets/header/location.svg"
          alt=""
          width="28"
          height="28"
          class="courier-shell__logo-img"
        />
        <span class="courier-shell__logo-text">Location</span>
      </button>
      <h1>კურიერის პანელი</h1>
      <p class="courier-shell__name">{{ courierName() }}</p>
    </div>
    <button type="button" class="courier-shell__logout" (click)="logout()">გასვლა</button>
  </header>

  <nav class="courier-shell__tabs" aria-label="Courier navigation">
    <a
      routerLink="/courier/orders"
      routerLinkActive="is-active"
      class="courier-shell__tab"
    >
      მიმდინარე
    </a>
    <a
      routerLink="/courier/history"
      routerLinkActive="is-active"
      class="courier-shell__tab"
    >
      ისტორია
    </a>
  </nav>

  <router-outlet />
</div>
