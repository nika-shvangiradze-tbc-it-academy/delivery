<app-delivery-header />

<section class="auth-page">
  <div class="auth-page__panel">
    <h1 class="auth-page__title">{{ 'auth.registerTitle' | t }}</h1>
    <p class="auth-page__lead">{{ 'auth.registerLead' | t }}</p>

    @if (errorMessage()) {
      <p class="auth-page__error" role="alert">{{ errorMessage() }}</p>
    }

    <form class="auth-page__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="auth-page__field">
        <span>{{ 'auth.fullName' | t }}</span>
        <input type="text" formControlName="fullName" autocomplete="name" />
      </label>

      <label class="auth-page__field">
        <span>{{ 'auth.phone' | t }}</span>
        <input type="tel" formControlName="phone" autocomplete="tel" />
      </label>

      <label class="auth-page__field">
        <span>{{ 'auth.email' | t }}</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="auth-page__field">
        <span>{{ 'auth.password' | t }}</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label class="auth-page__remember">
        <input type="checkbox" formControlName="rememberMe" />
        <span>{{ 'auth.rememberMe' | t }}</span>
      </label>

      <button class="auth-page__submit" type="submit" [disabled]="loading()">
        {{ loading() ? ('auth.loading' | t) : ('auth.registerAction' | t) }}
      </button>
    </form>

    <p class="auth-page__switch">
      {{ 'auth.hasAccount' | t }}
      <a routerLink="/login">{{ 'auth.loginAction' | t }}</a>
    </p>
  </div>
</section>
