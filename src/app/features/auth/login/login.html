<app-delivery-header />

<section class="auth-page">
  <div class="auth-page__panel">
    <h1 class="auth-page__title">{{ 'auth.loginTitle' | t }}</h1>
    <p class="auth-page__lead">{{ 'auth.loginLead' | t }}</p>

    @if (errorMessage()) {
      <p class="auth-page__error" role="alert">{{ errorMessage() }}</p>
    }

    <form class="auth-page__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="auth-page__field">
        <span>{{ 'auth.email' | t }}</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="auth-page__field">
        <span>{{ 'auth.password' | t }}</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <button class="auth-page__submit" type="submit" [disabled]="loading()">
        {{ loading() ? ('auth.loading' | t) : ('auth.loginAction' | t) }}
      </button>
    </form>

    <p class="auth-page__switch">
      {{ 'auth.noAccount' | t }}
      <a routerLink="/register">{{ 'auth.registerAction' | t }}</a>
    </p>
  </div>
</section>
