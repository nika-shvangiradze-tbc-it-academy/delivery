<app-delivery-header />

<section class="order-form-page">
  <div class="order-form-page__container">
    <h1 class="order-form-page__title">{{ 'orders.createTitle' | t }}</h1>
    <p class="order-form-page__lead">{{ 'orders.createLead' | t }}</p>

    @if (errorMessage()) {
      <p class="order-form-page__error" role="alert">{{ errorMessage() }}</p>
    }

    <form class="order-form-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <fieldset>
        <legend>{{ 'orders.senderInfo' | t }}</legend>
        <div class="order-form-page__grid">
          <label class="order-form-page__field" data-field="sender_name" [class.order-form-page__field--invalid]="isFieldInvalid('sender_name')">
            <span>{{ 'orders.senderName' | t }}</span>
            <input
              type="text"
              formControlName="sender_name"
              autocomplete="name"
              [attr.aria-invalid]="isFieldInvalid('sender_name')"
              [attr.aria-describedby]="isFieldInvalid('sender_name') ? fieldErrorId('sender_name') : null"
            />
            @if (getFieldError('sender_name'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('sender_name')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="sender_phone" [class.order-form-page__field--invalid]="isFieldInvalid('sender_phone')">
            <span>{{ 'orders.senderPhone' | t }}</span>
            <input
              type="tel"
              formControlName="sender_phone"
              autocomplete="tel"
              [attr.aria-invalid]="isFieldInvalid('sender_phone')"
              [attr.aria-describedby]="isFieldInvalid('sender_phone') ? fieldErrorId('sender_phone') : null"
            />
            @if (getFieldError('sender_phone'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('sender_phone')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="pickup_city" [class.order-form-page__field--invalid]="isFieldInvalid('pickup_city')">
            <span>{{ 'orders.pickupCity' | t }}</span>
            <select
              formControlName="pickup_city"
              [attr.aria-invalid]="isFieldInvalid('pickup_city')"
              [attr.aria-describedby]="isFieldInvalid('pickup_city') ? fieldErrorId('pickup_city') : null"
            >
              <option value="">აირჩიე ქალაქი</option>
              @for (city of cities; track city) {
                <option [value]="city">{{ city }}</option>
              }
            </select>
            @if (getFieldError('pickup_city'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('pickup_city')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="pickup_district" [class.order-form-page__field--invalid]="isFieldInvalid('pickup_district')">
            <span>{{ 'orders.pickupDistrict' | t }}</span>
            <input
              type="text"
              formControlName="pickup_district"
              [attr.aria-invalid]="isFieldInvalid('pickup_district')"
              [attr.aria-describedby]="isFieldInvalid('pickup_district') ? fieldErrorId('pickup_district') : null"
            />
            @if (getFieldError('pickup_district'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('pickup_district')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field order-form-page__full" data-field="pickup_address" [class.order-form-page__field--invalid]="isFieldInvalid('pickup_address')">
            <span>{{ 'orders.pickupAddress' | t }}</span>
            <input
              type="text"
              formControlName="pickup_address"
              [attr.aria-invalid]="isFieldInvalid('pickup_address')"
              [attr.aria-describedby]="isFieldInvalid('pickup_address') ? fieldErrorId('pickup_address') : null"
            />
            @if (getFieldError('pickup_address'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('pickup_address')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__full order-form-page__check">
            <input type="checkbox" formControlName="remember_sender" />
            <span>ჩემი მონაცემების დამახსოვრება</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>{{ 'orders.recipientInfo' | t }}</legend>
        <div class="order-form-page__grid">
          <label class="order-form-page__field" data-field="recipient_name" [class.order-form-page__field--invalid]="isFieldInvalid('recipient_name')">
            <span>{{ 'orders.recipientName' | t }}</span>
            <input
              type="text"
              formControlName="recipient_name"
              [attr.aria-invalid]="isFieldInvalid('recipient_name')"
              [attr.aria-describedby]="isFieldInvalid('recipient_name') ? fieldErrorId('recipient_name') : null"
            />
            @if (getFieldError('recipient_name'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('recipient_name')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="recipient_phone" [class.order-form-page__field--invalid]="isFieldInvalid('recipient_phone')">
            <span>{{ 'orders.recipientPhone' | t }}</span>
            <input
              type="tel"
              formControlName="recipient_phone"
              autocomplete="tel"
              [attr.aria-invalid]="isFieldInvalid('recipient_phone')"
              [attr.aria-describedby]="isFieldInvalid('recipient_phone') ? fieldErrorId('recipient_phone') : null"
            />
            @if (getFieldError('recipient_phone'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('recipient_phone')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="delivery_city" [class.order-form-page__field--invalid]="isFieldInvalid('delivery_city')">
            <span>{{ 'orders.deliveryCity' | t }}</span>
            <select
              formControlName="delivery_city"
              [attr.aria-invalid]="isFieldInvalid('delivery_city')"
              [attr.aria-describedby]="isFieldInvalid('delivery_city') ? fieldErrorId('delivery_city') : null"
            >
              <option value="">აირჩიე ქალაქი</option>
              @for (city of cities; track city) {
                <option [value]="city">{{ city }}</option>
              }
            </select>
            @if (getFieldError('delivery_city'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('delivery_city')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="delivery_district" [class.order-form-page__field--invalid]="isFieldInvalid('delivery_district')">
            <span>{{ 'orders.deliveryDistrict' | t }}</span>
            <input
              type="text"
              formControlName="delivery_district"
              [attr.aria-invalid]="isFieldInvalid('delivery_district')"
              [attr.aria-describedby]="isFieldInvalid('delivery_district') ? fieldErrorId('delivery_district') : null"
            />
            @if (getFieldError('delivery_district'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('delivery_district')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field order-form-page__full" data-field="delivery_address" [class.order-form-page__field--invalid]="isFieldInvalid('delivery_address')">
            <span>{{ 'orders.deliveryAddress' | t }}</span>
            <input
              type="text"
              formControlName="delivery_address"
              [attr.aria-invalid]="isFieldInvalid('delivery_address')"
              [attr.aria-describedby]="isFieldInvalid('delivery_address') ? fieldErrorId('delivery_address') : null"
            />
            @if (getFieldError('delivery_address'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('delivery_address')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>{{ 'orders.orderInfo' | t }}</legend>
        <div class="order-form-page__grid">
          <label class="order-form-page__field" data-field="parcel_count" [class.order-form-page__field--invalid]="isFieldInvalid('parcel_count')">
            <span>{{ 'orders.parcelCount' | t }}</span>
            <input
              type="number"
              min="1"
              step="1"
              formControlName="parcel_count"
              [attr.aria-invalid]="isFieldInvalid('parcel_count')"
              [attr.aria-describedby]="
                isFieldInvalid('parcel_count')
                  ? fieldErrorId('parcel_count') + ' create-order-parcel-hint'
                  : 'create-order-parcel-hint'
              "
            />
            <small id="create-order-parcel-hint" class="order-form-page__hint">{{ 'orders.parcelCountHint' | t }}</small>
            @if (getFieldError('parcel_count'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('parcel_count')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="delivery_date" [class.order-form-page__field--invalid]="isFieldInvalid('delivery_date')">
            <span>{{ 'orders.deliveryDate' | t }}</span>
            <input
              type="date"
              [attr.min]="minDeliveryDate"
              formControlName="delivery_date"
              [attr.aria-invalid]="isFieldInvalid('delivery_date')"
              [attr.aria-describedby]="isFieldInvalid('delivery_date') ? fieldErrorId('delivery_date') : null"
            />
            @if (getFieldError('delivery_date'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('delivery_date')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__field" data-field="amount_to_collect" [class.order-form-page__field--invalid]="isFieldInvalid('amount_to_collect')">
            <span>მომხმარებლისგან ასაღები თანხა (₾)</span>
            <input
              type="text"
              inputmode="decimal"
              formControlName="amount_to_collect"
              placeholder="25.00"
              [attr.aria-invalid]="isFieldInvalid('amount_to_collect')"
              [attr.aria-describedby]="isFieldInvalid('amount_to_collect') ? fieldErrorId('amount_to_collect') : null"
            />
            @if (getFieldError('amount_to_collect'); as err) {
              <span class="order-form-page__field-error" [id]="fieldErrorId('amount_to_collect')" role="alert">
                <span aria-hidden="true">⚠</span> {{ err }}
              </span>
            }
          </label>
          <label class="order-form-page__full order-form-page__check">
            <input type="checkbox" formControlName="is_fragile" />
            <span>მსხვრევადი ამანათი</span>
          </label>
          <label class="order-form-page__full">
            <span>{{ 'orders.notes' | t }}</span>
            <textarea rows="3" formControlName="notes"></textarea>
          </label>
        </div>
      </fieldset>

      <button class="order-form-page__submit" type="submit" [disabled]="loading()">
        {{ loading() ? ('common.loading' | t) : ('orders.submit' | t) }}
      </button>
    </form>
  </div>
</section>
